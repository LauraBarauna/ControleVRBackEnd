spring:
  application:
    name: controleVR

  datasource:
    url: jdbc:postgresql://localhost:5433/controleVR
    username: postgres
    password: postgress
    driver-class-name: org.postgresql.Driver

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
